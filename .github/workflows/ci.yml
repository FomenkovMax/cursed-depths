name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma generate (запускается через postinstall при npm ci) и next build требуют
      # заданный DATABASE_URL — реальная БД не нужна ни для generate, ни для сборки, но
      # переменная должна существовать, иначе Prisma падает на этапе чтения datasource.
      DATABASE_URL: file:./db/ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: mkdir -p db

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
